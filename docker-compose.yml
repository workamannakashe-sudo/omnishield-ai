version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: omnishield-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: omnishield
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - omnishield-network

  redis:
    image: redis:7-alpine
    container_name: omnishield-redis
    ports:
      - "6379:6379"
    networks:
      - omnishield-network

  chromadb:
    image: chromadb/chroma:0.4.22
    container_name: omnishield-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/data
    networks:
      - omnishield-network

  minio:
    image: minio/minio:RELEASE.2024-01-28T22-41-11Z
    container_name: omnishield-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - omnishield-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omnishield-backend
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/omnishield
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    depends_on:
      - postgres
      - redis
      - chromadb
    networks:
      - omnishield-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: omnishield-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NEXT_PUBLIC_WS_URL=ws://backend:8000/ws/events
    depends_on:
      - backend
    networks:
      - omnishield-network

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omnishield-celery
    command: celery -A app.celery_worker.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/omnishield
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
      - postgres
    networks:
      - omnishield-network

  edge-server-sim:
    image: python:3.10-slim
    container_name: omnishield-edge-sim
    depends_on:
      - backend
    command: >
      bash -c "pip install httpx && python -c '
      import time, httpx
      print(\"Edge server simulator started...\")
      while True:
          try:
              # Ping heartbeat API
              r = httpx.post(\"http://backend:8000/api/centers/1/heartbeat\")
              print(\"Heartbeat ping successful\", r.status_code)
          except Exception as e:
              print(\"Heartbeat ping failed\", e)
          time.sleep(30)
      '"
    networks:
      - omnishield-network

networks:
  omnishield-network:
    driver: bridge

volumes:
  postgres_data:
  chroma_data:
  minio_data:
